          cat << 'EOF' > src/com/jarvis/app/MainActivity.java
          package com.jarvis.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.*;

          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;

          public class MainActivity extends Activity {

              private SharedPreferences prefs;
              private TextView logView;
              private TextView customListView;
              private Button btnToggle;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("jarvis_prefs", Context.MODE_PRIVATE);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(36, 36, 36, 48);

                  TextView title = new TextView(this);
                  title.setText("JARVIS ASSISTANT");
                  title.setTextSize(24f);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  title.setTextColor(Color.parseColor("#38BDF8"));
                  title.setPadding(0, 0, 0, 20);
                  root.addView(title);

                  // Кнопка запуска/остановки
                  btnToggle = new Button(this);
                  updateToggleButton();
                  btnToggle.setOnClickListener(v -> {
                      if (JarvisService.isRunning) {
                          stopService(new Intent(this, JarvisService.class));
                          btnToggle.setText("ЗАПУСТИТЬ JARVIS");
                      } else {
                          if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                              requestNeededPermissions();
                              Toast.makeText(this, "Сначала выдайте доступ к микрофону", Toast.LENGTH_LONG).show();
                              return;
                          }
                          Intent svc = new Intent(this, JarvisService.class);
                          startForegroundService(svc);
                          btnToggle.setText("ОСТАНОВИТЬ JARVIS");
                      }
                  });
                  root.addView(btnToggle);

                  // Кнопки разрешений
                  Button btnPerms = new Button(this);
                  btnPerms.setText("1. Выдать разрешения (Микрофон, Камера, Уведомления)");
                  btnPerms.setOnClickListener(v -> requestNeededPermissions());
                  root.addView(btnPerms);

                  Button btnOverlay = new Button(this);
                  btnOverlay.setText("2. Разрешить запуск приложений из фона (Поверх окон)");
                  btnOverlay.setOnClickListener(v -> {
                      if (!Settings.canDrawOverlays(this)) {
                          Intent i = new Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:" + getPackageName())
                          );
                          startActivity(i);
                      } else {
                          Toast.makeText(this, "Разрешение уже выдано", Toast.LENGTH_SHORT).show();
                      }
                  });
                  root.addView(btnOverlay);

                  // Ручной тест команд
                  root.addView(sectionHeader("Тест команды текстом"));
                  EditText editManual = new EditText(this);
                  editManual.setHint("Напр.: включи фонарик / открой телеграм");
                  root.addView(editManual);

                  Button btnManual = new Button(this);
                  btnManual.setText("Выполнить команду");
                  btnManual.setOnClickListener(v -> {
                      String txt = editManual.getText().toString().trim();
                      if (txt.isEmpty()) return;
                      if (JarvisService.isRunning) {
                          Intent svc = new Intent(this, JarvisService.class);
                          svc.putExtra("manual_command", txt);
                          startForegroundService(svc);
                      } else {
                          CommandManager cm = new CommandManager(this);
                          cm.execute(txt, msg -> {
                              appendLocalLog("Jarvis: " + msg);
                              Toast.makeText(this, msg, Toast.LENGTH_SHORT).show();
                          });
                      }
                      editManual.setText("");
                  });
                  root.addView(btnManual);

                  // Настройки голоса и активации
                  root.addView(sectionHeader("Настройки голоса и активации"));

                  TextView wakeLabel = new TextView(this);
                  wakeLabel.setText("Слово вызова (по умолчанию «джарвис»):");
                  root.addView(wakeLabel);

                  EditText editWake = new EditText(this);
                  editWake.setText(prefs.getString("wake_word", "джарвис"));
                  root.addView(editWake);

                  Switch swRequireWake = new Switch(this);
                  swRequireWake.setText("Ждать слово вызова перед командой");
                  swRequireWake.setChecked(prefs.getBoolean("require_wake_word", true));
                  root.addView(swRequireWake);

                  Switch swVoice = new Switch(this);
                  swVoice.setText("Озвучивать действия голосом");
                  swVoice.setChecked(prefs.getBoolean("voice_enabled", true));
                  root.addView(swVoice);

                  float savedPitch = prefs.getFloat("voice_pitch", 0.85f);
                  TextView pitchLabel = new TextView(this);
                  pitchLabel.setText(String.format(Locale.US, "Тембр голоса: %.2f", savedPitch));
                  root.addView(pitchLabel);

                  SeekBar seekPitch = new SeekBar(this);
                  seekPitch.setMax(150);
                  seekPitch.setProgress((int) ((savedPitch - 0.5f) * 100));
                  seekPitch.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar sb, int p, boolean u) {
                          pitchLabel.setText(String.format(Locale.US, "Тембр голоса: %.2f", 0.5f + p / 100f));
                      }
                      @Override public void onStartTrackingTouch(SeekBar sb) {}
                      @Override public void onStopTrackingTouch(SeekBar sb) {}
                  });
                  root.addView(seekPitch);

                  float savedSpeed = prefs.getFloat("voice_speed", 1.05f);
                  TextView speedLabel = new TextView(this);
                  speedLabel.setText(String.format(Locale.US, "Скорость речи: %.2f", savedSpeed));
                  root.addView(speedLabel);

                  SeekBar seekSpeed = new SeekBar(this);
                  seekSpeed.setMax(150);
                  seekSpeed.setProgress((int) ((savedSpeed - 0.5f) * 100));
                  seekSpeed.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar sb, int p, boolean u) {
                          speedLabel.setText(String.format(Locale.US, "Скорость речи: %.2f", 0.5f + p / 100f));
                      }
                      @Override public void onStartTrackingTouch(SeekBar sb) {}
                      @Override public void onStopTrackingTouch(SeekBar sb) {}
                  });
                  root.addView(seekSpeed);

                  Button btnSave = new Button(this);
                  btnSave.setText("Сохранить настройки");
                  btnSave.setOnClickListener(v -> {
                      String w = editWake.getText().toString().trim();
                      if (w.isEmpty()) w = "джарвис";
                      prefs.edit()
                              .putString("wake_word", w)
                              .putBoolean("require_wake_word", swRequireWake.isChecked())
                              .putBoolean("voice_enabled", swVoice.isChecked())
                              .putFloat("voice_pitch", 0.5f + seekPitch.getProgress() / 100f)
                              .putFloat("voice_speed", 0.5f + seekSpeed.getProgress() / 100f)
                              .apply();
                      Toast.makeText(this, "Настройки сохранены", Toast.LENGTH_SHORT).show();
                  });
                  root.addView(btnSave);

                  // Свои команды
                  root.addView(sectionHeader("Свои голосовые команды"));
                  EditText editPhrase = new EditText(this);
                  editPhrase.setHint("Фраза (напр.: музыка)");
                  root.addView(editPhrase);

                  EditText editAction = new EditText(this);
                  editAction.setHint("Имя приложения или ссылка https://...");
                  root.addView(editAction);

                  Button btnAddCmd = new Button(this);
                  btnAddCmd.setText("Добавить свою команду");
                  btnAddCmd.setOnClickListener(v -> {
                      String p = editPhrase.getText().toString().trim();
                      String a = editAction.getText().toString().trim();
                      if (!p.isEmpty() && !a.isEmpty()) {
                          Set<String> set = new HashSet<String>(prefs.getStringSet("custom_commands", new HashSet<String>()));
                          set.add(p + "||" + a);
                          prefs.edit().putStringSet("custom_commands", set).apply();
                          editPhrase.setText("");
                          editAction.setText("");
                          refreshCustomCommands();
                          Toast.makeText(this, "Команда добавлена", Toast.LENGTH_SHORT).show();
                      }
                  });
                  root.addView(btnAddCmd);

                  Button btnClearCmds = new Button(this);
                  btnClearCmds.setText("Очистить свои команды");
                  btnClearCmds.setOnClickListener(v -> {
                      prefs.edit().remove("custom_commands").apply();
                      refreshCustomCommands();
                  });
                  root.addView(btnClearCmds);

                  customListView = new TextView(this);
                  customListView.setPadding(0, 8, 0, 16);
                  root.addView(customListView);
                  refreshCustomCommands();

                  // Журнал работы
                  root.addView(sectionHeader("Журнал работы"));
                  logView = new TextView(this);
                  logView.setTextSize(13f);
                  logView.setBackgroundColor(Color.parseColor("#111827"));
                  logView.setTextColor(Color.parseColor("#E5E7EB"));
                  logView.setPadding(20, 20, 20, 20);
                  logView.setText(JarvisService.getLogsText().isEmpty()
                          ? "Лог пуст. Выдайте права и нажмите «ЗАПУСТИТЬ JARVIS»."
                          : JarvisService.getLogsText());
                  root.addView(logView);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);
                  setContentView(scroll);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  updateToggleButton();
                  logView.setText(JarvisService.getLogsText().isEmpty()
                          ? "Лог пуст. Выдайте права и нажмите «ЗАПУСТИТЬ JARVIS»."
                          : JarvisService.getLogsText());
                  JarvisService.setLogListener(line -> runOnUiThread(() -> logView.setText(JarvisService.getLogsText())));
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  JarvisService.setLogListener(null);
              }

              private void appendLocalLog(String line) {
                  String cur = logView.getText().toString();
                  logView.setText(cur + "\n" + line);
              }

              private void updateToggleButton() {
                  btnToggle.setText(JarvisService.isRunning ? "ОСТАНОВИТЬ JARVIS" : "ЗАПУСТИТЬ JARVIS");
              }

              private TextView sectionHeader(String text) {
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextSize(16f);
                  tv.setTypeface(Typeface.DEFAULT_BOLD);
                  tv.setTextColor(Color.parseColor("#7DD3FC"));
                  tv.setPadding(0, 28, 0, 8);
                  return tv;
              }

              private void refreshCustomCommands() {
                  Set<String> set = prefs.getStringSet("custom_commands", new HashSet<String>());
                  if (set.isEmpty()) {
                      customListView.setText("Своих команд пока нет.");
                      return;
                  }
                  StringBuilder sb = new StringBuilder("Сохранённые команды:\n");
                  for (String entry : set) {
                      String[] parts = entry.split("\\|\\|");
                      if (parts.length == 2) {
                          sb.append("• «").append(parts[0]).append("» → ").append(parts[1]).append("\n");
                      }
                  }
                  customListView.setText(sb.toString());
              }

              private void requestNeededPermissions() {
                  List<String> list = new ArrayList<String>();
                  list.add(Manifest.permission.RECORD_AUDIO);
                  list.add(Manifest.permission.CAMERA);
                  if (Build.VERSION.SDK_INT >= 33) {
                      list.add("android.permission.POST_NOTIFICATIONS");
                  }
                  requestPermissions(list.toArray(new String[0]), 1001);
              }

              @Override
              public void onRequestPermissionsResult(int reqCode, String[] perms, int[] results) {
                  super.onRequestPermissionsResult(reqCode, perms, results);
                  boolean allOk = true;
                  for (int r : results) {
                      if (r != PackageManager.PERMISSION_GRANTED) allOk = false;
                  }
                  Toast.makeText(
                          this,
                          allOk ? "Разрешения выданы!" : "Часть разрешений не выдана — некоторые функции не сработают.",
                          Toast.LENGTH_LONG
                  ).show();
              }
          }
          EOF

      - name: Compile and Sign APK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ANDROID_JAR=$(ls -d "$SDK"/platforms/android-*/android.jar 2>/dev/null | sort -V | tail -n 1)
          BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$ANDROID_JAR" ] || [ -z "$BUILD_TOOLS" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
            ANDROID_JAR="$SDK/platforms/android-34/android.jar"
            BUILD_TOOLS="$SDK/build-tools/34.0.0"
          fi

          echo "Using $ANDROID_JAR and $BUILD_TOOLS"

          "$BUILD_TOOLS/aapt2" compile --dir res -o res.zip

          "$BUILD_TOOLS/aapt2" link -o unsigned.apk \
            -I "$ANDROID_JAR" \
            --manifest AndroidManifest.xml \
            --min-sdk-version 26 \
            --target-sdk-version 34 \
            --version-code 1 \
            --version-name "1.0" \
            res.zip

          javac -encoding UTF-8 -source 1.8 -target 1.8 \
            -bootclasspath "$ANDROID_JAR" \
            -d obj src/com/jarvis/app/*.java

          find obj -name "*.class" -print0 | xargs -0 "$BUILD_TOOLS/d8" \
            --min-api 26 --lib "$ANDROID_JAR" --output dex

          zip -j unsigned.apk dex/classes.dex

          "$BUILD_TOOLS/zipalign" -f -p 4 unsigned.apk aligned.apk

          keytool -genkeypair -v -keystore jarvis.keystore -alias jarvis \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=Jarvis, OU=App, O=Jarvis, L=City, S=State, C=US"

          "$BUILD_TOOLS/apksigner" sign \
            --ks jarvis.keystore --ks-key-alias jarvis \
            --ks-pass pass:123456 --key-pass pass:123456 \
            --out Jarvis.apk aligned.apk

          "$BUILD_TOOLS/apksigner" verify Jarvis.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: Jarvis.apk
          
