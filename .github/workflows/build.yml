name: Build Jarvis APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create project files
        run: |
          mkdir -p src/com/jarvis/app res/drawable res/values obj dex

          cat << 'EOF' > res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Jarvis</string>
          </resources>
          EOF

          cat << 'EOF' > res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0B132B"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#00E5FF"
                  android:pathData="M54,18a36,36 0 1,0 0,72a36,36 0 1,0 0,-72zM54,26a28,28 0 1,1 0,56a28,28 0 1,1 0,-56z" />
              <path
                  android:fillColor="#38BDF8"
                  android:pathData="M54,36a18,18 0 1,0 0,36a18,18 0 1,0 0,-36z" />
          </vector>
          EOF

          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.jarvis.app"
              android:versionCode="1"
              android:versionName="1.0">

              <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="34" />

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".JarvisService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > src/com/jarvis/app/CommandManager.java
          package com.jarvis.app;

          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.hardware.camera2.CameraCharacteristics;
          import android.hardware.camera2.CameraManager;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.provider.AlarmClock;
          import android.provider.Settings;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class CommandManager {

              public interface StatusCallback {
                  void onStatus(String message);
              }

              private final Context context;
              private final SharedPreferences prefs;

              public CommandManager(Context context) {
                  this.context = context.getApplicationContext();
                  this.prefs = this.context.getSharedPreferences("jarvis_prefs", Context.MODE_PRIVATE);
              }

              public void execute(String rawCommand, StatusCallback cb) {
                  if (rawCommand == null) return;
                  String cmd = rawCommand.toLowerCase(new Locale("ru")).trim();
                  if (cmd.isEmpty()) return;

                  // 1. Пользовательские команды
                  Set<String> customCmds = prefs.getStringSet("custom_commands", new HashSet<String>());
                  for (String entry : customCmds) {
                      String[] parts = entry.split("\\|\\|");
                      if (parts.length == 2) {
                          String phrase = parts[0].toLowerCase(new Locale("ru")).trim();
                          String target = parts[1].trim();
                          if (!phrase.isEmpty() && cmd.contains(phrase)) {
                              cb.onStatus("Выполняю вашу команду: " + parts[0]);
                              boolean ok = target.startsWith("http://") || target.startsWith("https://")
                                      ? openUrl(target)
                                      : openAppByName(target);
                              cb.onStatus(ok ? "Команда выполнена." : "Не удалось выполнить команду.");
                              return;
                          }
                      }
                  }

                  // 2. Фонарик
                  if (cmd.contains("фонарик") || cmd.contains("вспышк") || cmd.contains("свет")) {
                      boolean turnOn = !cmd.contains("выкл") && !cmd.contains("погас") && !cmd.contains("убер");
                      cb.onStatus(turnOn ? "Включаю фонарик." : "Выключаю фонарик.");
                      boolean ok = toggleFlashlight(turnOn);
                      if (ok) {
                          cb.onStatus(turnOn ? "Фонарик включён." : "Фонарик выключен.");
                      } else {
                          cb.onStatus("Нет доступа к фонарику. Проверьте разрешение камеры.");
                      }
                      return;
                  }

                  // 3. Запуск приложений
                  if (cmd.startsWith("открой ") || cmd.startsWith("запусти ") || cmd.startsWith("включи приложение ")) {
                      String appName = cmd
                              .replaceFirst("^открой\\s+", "")
                              .replaceFirst("^запусти\\s+", "")
                              .replaceFirst("^включи приложение\\s+", "")
                              .trim();
                      cb.onStatus("Открываю " + appName + ".");
                      boolean ok = openAppByName(appName);
                      cb.onStatus(ok ? "Приложение " + appName + " открыто." : "Приложение " + appName + " не найдено.");
                      return;
                  }

                  // 4. Громкость
                  if (cmd.contains("громче") || cmd.contains("прибавь звук")) {
                      cb.onStatus("Увеличиваю громкость.");
                      adjustVolume(AudioManager.ADJUST_RAISE);
                      cb.onStatus("Громкость увеличена.");
                      return;
                  }
                  if (cmd.contains("тише") || cmd.contains("убавь звук")) {
                      cb.onStatus("Уменьшаю громкость.");
                      adjustVolume(AudioManager.ADJUST_LOWER);
                      cb.onStatus("Громкость уменьшена.");
                      return;
                  }
                  if (cmd.contains("без звука") || cmd.contains("выключи звук")) {
                      cb.onStatus("Отключаю звук.");
                      AudioManager am = (AudioManager) context.getSystemService(Context.AUDIO_SERVICE);
                      if (am != null) {
                          am.setStreamVolume(AudioManager.STREAM_MUSIC, 0, AudioManager.FLAG_SHOW_UI);
                      }
                      cb.onStatus("Звук отключён.");
                      return;
                  }

                  // 5. Время и дата
                  if (cmd.contains("время") || cmd.contains("который час")) {
                      String time = new SimpleDateFormat("HH:mm", new Locale("ru")).format(new Date());
                      cb.onStatus("Сейчас " + time + ".");
                      return;
                  }
                  if (cmd.contains("дата") || cmd.contains("какое число")) {
                      String date = new SimpleDateFormat("d MMMM, EEEE", new Locale("ru")).format(new Date());
                      cb.onStatus("Сегодня " + date + ".");
                      return;
                  }

                  // 6. Заряд батареи
                  if (cmd.contains("заряд") || cmd.contains("батаре")) {
                      int level = getBatteryLevel();
                      cb.onStatus("Заряд батареи: " + level + " процентов.");
                      return;
                  }

                  // 7. Таймер
                  if (cmd.contains("таймер")) {
                      int num = extractFirstNumber(cmd, 1);
                      int seconds;
                      String unit;
                      if (cmd.contains("секунд")) {
                          seconds = num;
                          unit = "секунд";
                      } else if (cmd.contains("час")) {
                          seconds = num * 3600;
                          unit = "часов";
                      } else {
                          seconds = num * 60;
                          unit = "минут";
                      }
                      cb.onStatus("Ставлю таймер на " + num + " " + unit + ".");
                      boolean ok = setTimer(seconds);
                      cb.onStatus(ok ? "Таймер запущен." : "Не удалось открыть приложение часов.");
                      return;
                  }

                  // 8. Wi-Fi / Bluetooth / Настройки
                  if (cmd.contains("вайфай") || cmd.contains("wi-fi") || cmd.contains("интернет")) {
                      cb.onStatus("Открываю панель интернета.");
                      openConnectivityPanel();
                      cb.onStatus("Панель открыта.");
                      return;
                  }
                  if (cmd.contains("блютуз") || cmd.contains("bluetooth")) {
                      cb.onStatus("Открываю настройки блютуз.");
                      openActivitySafe(new Intent(Settings.ACTION_BLUETOOTH_SETTINGS));
                      cb.onStatus("Настройки блютуз открыты.");
                      return;
                  }
                  if (cmd.contains("яркость") || cmd.contains("экран")) {
                      cb.onStatus("Открываю настройки экрана.");
                      openActivitySafe(new Intent(Settings.ACTION_DISPLAY_SETTINGS));
                      cb.onStatus("Настройки экрана открыты.");
                      return;
                  }
                  if (cmd.equals("настройки") || cmd.contains("открой настройки")) {
                      cb.onStatus("Открываю настройки телефона.");
                      openActivitySafe(new Intent(Settings.ACTION_SETTINGS));
                      cb.onStatus("Настройки открыты.");
                      return;
                  }

                  // 9. Поиск в интернете
                  if (cmd.startsWith("найди ") || cmd.startsWith("погугли ") || cmd.startsWith("поиск ")) {
                      String query = cmd
                              .replaceFirst("^найди\\s+", "")
                              .replaceFirst("^погугли\\s+", "")
                              .replaceFirst("^поиск\\s+", "")
                              .trim();
                      cb.onStatus("Ищу в интернете: " + query + ".");
                      boolean ok = openUrl("https://www.google.com/search?q=" + Uri.encode(query));
                      cb.onStatus(ok ? "Поиск открыт." : "Не удалось открыть браузер.");
                      return;
                  }

                  // 10. Базовые ответы
                  if (cmd.contains("привет") || cmd.contains("здаров")) {
                      cb.onStatus("Привет. Готов выполнять команды.");
                      return;
                  }
                  if (cmd.contains("спасибо")) {
                      cb.onStatus("Всегда к вашим услугам.");
                      return;
                  }

                  cb.onStatus("Команда «" + cmd + "» не распознана.");
              }

              private boolean toggleFlashlight(boolean state) {
                  try {
                      CameraManager cm = (CameraManager) context.getSystemService(Context.CAMERA_SERVICE);
                      if (cm == null) return false;
                      for (String id : cm.getCameraIdList()) {
                          Boolean hasFlash = cm.getCameraCharacteristics(id)
                                  .get(CameraCharacteristics.FLASH_INFO_AVAILABLE);
                          if (Boolean.TRUE.equals(hasFlash)) {
                              cm.setTorchMode(id, state);
                              return true;
                          }
                      }
                  } catch (Exception ignored) {
                  }
                  return false;
              }

              private boolean openAppByName(String query) {
                  try {
                      PackageManager pm = context.getPackageManager();
                      List<ApplicationInfo> apps = pm.getInstalledApplications(PackageManager.GET_META_DATA);
                      String norm = query.toLowerCase(new Locale("ru")).trim();

                      Map<String, String> aliases = new HashMap<String, String>();
                      aliases.put("телеграм", "telegram");
                      aliases.put("телегу", "telegram");
                      aliases.put("ютуб", "youtube");
                      aliases.put("хром", "chrome");
                      aliases.put("камеру", "camera");
                      aliases.put("камера", "camera");
                      aliases.put("галерею", "gallery");
                      aliases.put("галерея", "gallery");
                      aliases.put("калькулятор", "calculator");
                      aliases.put("настройки", "settings");
                      aliases.put("тикток", "tiktok");
                      aliases.put("тик ток", "tiktok");
                      aliases.put("ватсап", "whatsapp");
                      aliases.put("инстаграм", "instagram");
                      aliases.put("спотифай", "spotify");
                      aliases.put("дискорд", "discord");

                      String target = aliases.containsKey(norm) ? aliases.get(norm) : norm;

                      // Сначала ищем по отображаемому названию
                      for (ApplicationInfo app : apps) {
                          Intent launch = pm.getLaunchIntentForPackage(app.packageName);
                          if (launch == null) continue;
                          String label = pm.getApplicationLabel(app).toString().toLowerCase(new Locale("ru"));
                          if (label.contains(target) || label.contains(norm)) {
                              launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              context.startActivity(launch);
                              return true;
                          }
                      }

                      // Затем по имени пакета
                      for (ApplicationInfo app : apps) {
                          Intent launch = pm.getLaunchIntentForPackage(app.packageName);
                          if (launch == null) continue;
                          if (app.packageName.toLowerCase(Locale.US).contains(target)) {
                              launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              context.startActivity(launch);
                              return true;
                          }
                      }
                  } catch (Exception ignored) {
                  }
                  return false;
              }

              private void adjustVolume(int direction) {
                  AudioManager am = (AudioManager) context.getSystemService(Context.AUDIO_SERVICE);
                  if (am != null) {
                      am.adjustStreamVolume(AudioManager.STREAM_MUSIC, direction, AudioManager.FLAG_SHOW_UI);
                      am.adjustStreamVolume(AudioManager.STREAM_MUSIC, direction, AudioManager.FLAG_SHOW_UI);
                  }
              }

              private int getBatteryLevel() {
                  Intent intent = context.registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                  if (intent == null) return -1;
                  int level = intent.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
                  int scale = intent.getIntExtra(BatteryManager.EXTRA_SCALE, -1);
                  return (level >= 0 && scale > 0) ? (level * 100) / scale : -1;
              }

              private int extractFirstNumber(String text, int fallback) {
                  Matcher m = Pattern.compile("\\d+").matcher(text);
                  if (m.find()) {
                      try {
                          return Integer.parseInt(m.group());
                      } catch (Exception ignored) {
                      }
                  }
                  return fallback;
              }

              private boolean setTimer(int seconds) {
                  try {
                      Intent intent = new Intent(AlarmClock.ACTION_SET_TIMER);
                      intent.putExtra(AlarmClock.EXTRA_LENGTH, seconds);
                      intent.putExtra(AlarmClock.EXTRA_SKIP_UI, false);
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      context.startActivity(intent);
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private void openConnectivityPanel() {
                  if (Build.VERSION.SDK_INT >= 29) {
                      if (openActivitySafe(new Intent(Settings.Panel.ACTION_INTERNET_CONNECTIVITY))) {
                          return;
                      }
                  }
                  openActivitySafe(new Intent(Settings.ACTION_WIFI_SETTINGS));
              }

              private boolean openActivitySafe(Intent intent) {
                  try {
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      context.startActivity(intent);
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private boolean openUrl(String url) {
                  return openActivitySafe(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
              }
          }
          EOF

          cat << 'EOF' > src/com/jarvis/app/JarvisService.java
          package com.jarvis.app;

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.widget.Toast;

          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.Locale;
          import java.util.UUID;

          public class JarvisService extends Service implements TextToSpeech.OnInitListener {

              public interface LogListener {
                  void onLog(String line);
              }

              public static volatile boolean isRunning = false;
              private static volatile LogListener logListener = null;
              private static final ArrayList<String> logHistory = new ArrayList<String>();

              public static void setLogListener(LogListener listener) {
                  logListener = listener;
              }

              public static String getLogsText() {
                  StringBuilder sb = new StringBuilder();
                  synchronized (logHistory) {
                      for (String s : logHistory) {
                          sb.append(s).append("\n");
                      }
                  }
                  return sb.toString();
              }

              private static void addLog(String text) {
                  synchronized (logHistory) {
                      logHistory.add(text);
                      if (logHistory.size() > 25) {
                          logHistory.remove(0);
                      }
                  }
                  LogListener l = logListener;
                  if (l != null) {
                      l.onLog(text);
                  }
              }

              private static final String CHANNEL_ID = "jarvis_voice_channel";
              private static final int NOTIF_ID = 101;

              private SpeechRecognizer speechRecognizer;
              private TextToSpeech tts;
              private CommandManager commandManager;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private final ArrayDeque<String> speechQueue = new ArrayDeque<String>();

              private boolean isListening = false;
              private boolean isSpeaking = false;
              private boolean awaitingCommand = false;
              private boolean ttsReady = false;

              @Override
              public void onCreate() {
                  super.onCreate();
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      addLog("Ошибка: нет разрешения на микрофон.");
                      stopSelf();
                      return;
                  }

                  isRunning = true;
                  commandManager = new CommandManager(this);
                  createNotificationChannel();
                  startForegroundSafe();

                  tts = new TextToSpeech(this, this);
                  initSpeechRecognizer();
                  addLog("Служба Jarvis запущена.");
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && intent.hasExtra("manual_command")) {
                      String manual = intent.getStringExtra("manual_command");
                      if (manual != null && !manual.trim().isEmpty()) {
                          addLog("Ручная команда: " + manual);
                          commandManager.execute(manual, this::speak);
                      }
                  }
                  return START_STICKY;
              }

              private void createNotificationChannel() {
                  NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "Jarvis Assistant",
                          NotificationManager.IMPORTANCE_LOW
                  );
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) {
                      nm.createNotificationChannel(channel);
                  }
              }

              private void startForegroundSafe() {
                  Intent openIntent = new Intent(this, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(
                          this, 0, openIntent, PendingIntent.FLAG_IMMUTABLE
                  );

                  Notification notif = new Notification.Builder(this, CHANNEL_ID)
                          .setContentTitle("Jarvis активен")
                          .setContentText("Нажмите, чтобы открыть настройки")
                          .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                          .setContentIntent(pi)
                          .setOngoing(true)
                          .build();

                  if (Build.VERSION.SDK_INT >= 30) {
                      startForeground(NOTIF_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
                  } else {
                      startForeground(NOTIF_ID, notif);
                  }
              }

              @Override
              public void onInit(int status) {
                  if (status == TextToSpeech.SUCCESS) {
                      int res = tts.setLanguage(new Locale("ru", "RU"));
                      if (res == TextToSpeech.LANG_MISSING_DATA || res == TextToSpeech.LANG_NOT_SUPPORTED) {
                          addLog("Внимание: русский голос TTS не установлен в системе.");
                      }
                      ttsReady = true;
                      applyVoiceSettings();
                      tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                          @Override
                          public void onStart(String utteranceId) {
                              isSpeaking = true;
                          }

                          @Override
                          public void onDone(String utteranceId) {
                              mainHandler.post(() -> processNextSpeechOrListen());
                          }

                          @Override
                          public void onError(String utteranceId) {
                              mainHandler.post(() -> processNextSpeechOrListen());
                          }
                      });
                      speak("Система запущена. Жду команду.");
                  } else {
                      addLog("TTS не запустился, работаю в текстовом режиме.");
                      startListeningDelayed(500);
                  }
              }

              private void applyVoiceSettings() {
                  if (tts == null) return;
                  SharedPreferences prefs = getSharedPreferences("jarvis_prefs", Context.MODE_PRIVATE);
                  float pitch = prefs.getFloat("voice_pitch", 0.85f);
                  float speed = prefs.getFloat("voice_speed", 1.05f);
                  tts.setPitch(pitch);
                  tts.setSpeechRate(speed);
              }

              private void speak(String text) {
                  addLog("Jarvis: " + text);
                  SharedPreferences prefs = getSharedPreferences("jarvis_prefs", Context.MODE_PRIVATE);
                  boolean voiceOn = prefs.getBoolean("voice_enabled", true);

                  if (!voiceOn || !ttsReady || tts == null) {
                      mainHandler.post(() -> Toast.makeText(getApplicationContext(), text, Toast.LENGTH_SHORT).show());
                      startListeningDelayed(400);
                      return;
                  }

                  mainHandler.post(() -> {
                      applyVoiceSettings();
                      speechQueue.addLast(text);
                      if (!isSpeaking) {
                          stopListening();
                          speakNext();
                      }
                  });
              }

              private void speakNext() {
                  String next = speechQueue.pollFirst();
                  if (next != null) {
                      isSpeaking = true;
                      tts.speak(next, TextToSpeech.QUEUE_FLUSH, null, UUID.randomUUID().toString());
                      // Страховка на случай зависания системного TTS
                      mainHandler.postDelayed(() -> {
                          if (isSpeaking && !tts.isSpeaking()) {
                              processNextSpeechOrListen();
                          }
                      }, 10000);
                  } else {
                      isSpeaking = false;
                      startListeningDelayed(300);
                  }
              }

              private void processNextSpeechOrListen() {
                  if (!speechQueue.isEmpty()) {
                      speakNext();
                  } else {
                      isSpeaking = false;
                      startListeningDelayed(300);
                  }
              }

              private void initSpeechRecognizer() {
                  mainHandler.post(() -> {
                      if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                          addLog("Ошибка: на телефоне нет службы распознавания речи (нужно приложение Google).");
                          return;
                      }
                      if (speechRecognizer != null) {
                          speechRecognizer.destroy();
                      }
                      speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                      speechRecognizer.setRecognitionListener(new RecognitionListener() {
                          @Override public void onReadyForSpeech(Bundle params) { isListening = true; }
                          @Override public void onBeginningOfSpeech() {}
                          @Override public void onRmsChanged(float rmsdB) {}
                          @Override public void onBufferReceived(byte[] buffer) {}
                          @Override public void onEndOfSpeech() { isListening = false; }

                          @Override
                          public void onError(int error) {
                              isListening = false;
                              if (error == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) {
                                  addLog("Нет прав на микрофон.");
                                  stopSelf();
                                  return;
                              }
                              if (isRunning && !isSpeaking) {
                                  long delay = (error == SpeechRecognizer.ERROR_RECOGNIZER_BUSY) ? 1200 : 600;
                                  startListeningDelayed(delay);
                              }
                          }

                          @Override
                          public void onResults(Bundle results) {
                              isListening = false;
                              ArrayList<String> list = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                              String heard = (list != null && !list.isEmpty()) ? list.get(0) : "";
                              handleHeard(heard);
                          }

                          @Override public void onPartialResults(Bundle partialResults) {}
                          @Override public void onEvent(int eventType, Bundle params) {}
                      });
                  });
              }

              private void handleHeard(String raw) {
                  String heard = raw.toLowerCase(new Locale("ru")).trim();
                  if (heard.isEmpty()) {
                      startListeningDelayed(300);
                      return;
                  }

                  addLog("Услышано: " + heard);

                  SharedPreferences prefs = getSharedPreferences("jarvis_prefs", Context.MODE_PRIVATE);
                  boolean requireWake = prefs.getBoolean("require_wake_word", true);
                  String wakeWord = prefs.getString("wake_word", "джарвис").toLowerCase(new Locale("ru")).trim();
                  if (wakeWord.isEmpty()) wakeWord = "джарвис";

                  if (!requireWake) {
                      commandManager.execute(heard, this::speak);
                      return;
                  }

                  if (heard.contains(wakeWord)) {
                      int idx = heard.indexOf(wakeWord) + wakeWord.length();
                      String afterWake = heard.substring(idx).trim();
                      if (!afterWake.isEmpty()) {
                          awaitingCommand = false;
                          commandManager.execute(afterWake, this::speak);
                      } else {
                          awaitingCommand = true;
                          speak("Слушаю.");
                      }
                  } else if (awaitingCommand) {
                      awaitingCommand = false;
                      commandManager.execute(heard, this::speak);
                  } else {
                      startListeningDelayed(300);
                  }
              }

              private void startListeningDelayed(long delayMs) {
                  mainHandler.postDelayed(() -> {
                      if (!isRunning || isSpeaking || isListening || speechRecognizer == null) return;
                      Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ru-RU");
                      intent.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, false);
                      try {
                          speechRecognizer.startListening(intent);
                      } catch (Exception e) {
                          initSpeechRecognizer();
                          startListeningDelayed(1200);
                      }
                  }, delayMs);
              }

              private void stopListening() {
                  mainHandler.post(() -> {
                      try {
                          if (speechRecognizer != null) {
                              speechRecognizer.stopListening();
                              speechRecognizer.cancel();
                          }
                      } catch (Exception ignored) {
                      }
                      isListening = false;
                  });
              }

              @Override
              public void onDestroy() {
                  isRunning = false;
                  mainHandler.removeCallbacksAndMessages(null);
                  if (speechRecognizer != null) {
                      speechRecognizer.destroy();
                      speechRecognizer = null;
                  }
                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                      tts = null;
                  }
                  addLog("Служба Jarvis остановлена.");
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
