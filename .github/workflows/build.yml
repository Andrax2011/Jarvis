name: Build Jarvis v2 APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Resources and Build APK
        run: |
          mkdir -p res/drawable res/values obj dex

          cat << 'EOF' > res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Jarvis AI</string></resources>
          EOF

          cat << 'EOF' > res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#060B19" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#00E5FF" android:pathData="M54,14a40,40 0 1,0 0,80a40,40 0 1,0 0,-80zM54,22a32,32 0 1,1 0,64a32,32 0 1,1 0,-64z" />
              <path android:fillColor="#38BDF8" android:pathData="M54,30a24,24 0 1,0 0,48a24,24 0 1,0 0,-48zM54,37a17,17 0 1,1 0,34a17,17 0 1,1 0,-34z" />
              <path android:fillColor="#E0F7FA" android:pathData="M54,44a10,10 0 1,0 0,20a10,10 0 1,0 0,-20z" />
          </vector>
          EOF

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ANDROID_JAR=$(ls -d "$SDK"/platforms/android-*/android.jar 2>/dev/null | sort -V | tail -n 1)
          BUILD_TOOLS=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -n 1)

          "$BUILD_TOOLS/aapt2" compile --dir res -o res.zip
          "$BUILD_TOOLS/aapt2" link -o unsigned.apk -I "$ANDROID_JAR" \
            --manifest AndroidManifest.xml --min-sdk-version 26 --target-sdk-version 34 \
            --version-code 2 --version-name "2.0" res.zip

          javac -encoding UTF-8 -source 1.8 -target 1.8 -classpath "$ANDROID_JAR" \
            -d obj src/com/jarvis/app/*.java

          find obj -name "*.class" -print0 | xargs -0 "$BUILD_TOOLS/d8" \
            --min-api 26 --lib "$ANDROID_JAR" --output dex

          zip -j unsigned.apk dex/classes.dex
          "$BUILD_TOOLS/zipalign" -f -p 4 unsigned.apk aligned.apk

          keytool -genkeypair -v -keystore jarvis.keystore -alias jarvis \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 \
            -dname "CN=Jarvis, OU=AI, O=Jarvis, L=City, S=State, C=US"

          "$BUILD_TOOLS/apksigner" sign --ks jarvis.keystore --ks-key-alias jarvis \
            --ks-pass pass:123456 --key-pass pass:123456 --out Jarvis-v2.apk aligned.apk
          "$BUILD_TOOLS/apksigner" verify Jarvis-v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-v2-APK
          path: Jarvis-v2.apk
          
